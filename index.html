<style>
  :root {
    --paper: #FBFAF6;
    --ink: #16181D;
    --chrome: #1E2230;
    --chrome-hi: #2A2F42;
    --chrome-line: #363C52;
    --on-chrome: #E7E9EF;
    --muted: #9AA0B4;
    --accent: #FF5C49;
    --live: #35C08B;
    --idle: #F2A83B;
    --shadow: 0 8px 30px rgba(16,18,29,.16), 0 2px 8px rgba(16,18,29,.10);
    --dock-shadow: 0 10px 40px rgba(16,18,29,.28);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper); color: var(--ink);
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  body.dark { --paper:#14161B; --ink:#EDEFF5; }
  #stage { position: fixed; inset: 0; cursor: crosshair; }
  #board { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
  #board .shape { stroke-linecap: round; stroke-linejoin: round; }
  #board text { cursor: default; }
  #board text tspan { pointer-events: none; }
  #cursors { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

  .brand {
    position: fixed; top: 16px; left: 18px; z-index: 30; margin: 0;
    display: flex; align-items: center; gap: 9px;
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: -.01em; color: var(--ink); user-select: none; pointer-events: none;
  }
  body.dark .brand { color: #EDEFF5; }
  .brand .dot { width: 11px; height: 11px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
  .brand small { font-family:'Inter'; font-weight:500; color: var(--muted); font-size: 12px; }
  .credit { position: fixed; top: 41px; left: 19px; z-index: 32; font: 500 11.5px 'Inter'; color: var(--muted); pointer-events: auto; }
  .credit a { color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(154,160,180,.45); }
  .credit a:hover { color: var(--accent); border-bottom-color: var(--accent); }
  body.dark .credit { color: #9AA0B4; }

  .dock {
    position: fixed; top: 84px; left: 16px; z-index: 30;
    background: var(--chrome); border-radius: 18px; padding: 8px;
    display: flex; flex-direction: column; gap: 4px; box-shadow: var(--dock-shadow);
    max-height: calc(100vh - 100px); overflow-y: auto; overflow-x: hidden; scrollbar-width: thin;
  }
  .dock::-webkit-scrollbar { width: 5px; } .dock::-webkit-scrollbar-thumb { background: var(--chrome-line); border-radius: 9px; }
  .dock hr { border: 0; border-top: 1px solid var(--chrome-line); margin: 5px 6px; }
  .tool {
    width: 40px; height: 40px; border: 0; border-radius: 11px; background: transparent;
    color: var(--on-chrome); display: grid; place-items: center; cursor: pointer; position: relative;
    transition: background .12s ease, color .12s ease;
  }
  .tool:hover { background: var(--chrome-hi); }
  .tool.active { background: var(--accent); color: #fff; }
  .tool.toggle.on { background: var(--chrome-hi); color: #fff; }
  .tool svg { width: 20px; height: 20px; }
  .tool .kbd { position: absolute; bottom: 2px; right: 4px; font-size: 8px; color: var(--muted); font-weight: 600; }
  .tool.active .kbd { color: rgba(255,255,255,.75); }

  .tray {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: var(--chrome); border-radius: 16px; box-shadow: var(--dock-shadow);
    padding: 8px 10px; display: flex; align-items: center; gap: 10px;
    max-width: calc(100vw - 130px); overflow-x: auto; scrollbar-width: thin;
  }
  .tray::-webkit-scrollbar { height: 5px; } .tray::-webkit-scrollbar-thumb { background: var(--chrome-line); border-radius: 9px; }
  .grp { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .sep { width: 1px; align-self: stretch; background: var(--chrome-line); flex: 0 0 auto; }
  .sw { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); transition: transform .1s ease; flex: 0 0 auto; padding:0; }
  .sw:hover { transform: scale(1.12); }
  .sw.active { border-color: #fff; transform: scale(1.12); }
  .sw[data-c="#FFFFFF"] { box-shadow: inset 0 0 0 1px rgba(0,0,0,.2); }
  .sw.rainbow { background: conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); position: relative; overflow: hidden; }
  .sw.rainbow input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .wbtn, .sbtn { min-width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px;
    display: grid; place-items: center; cursor: pointer; color: var(--on-chrome); padding: 0 6px; flex: 0 0 auto; }
  .wbtn:hover, .sbtn:hover { background: var(--chrome-hi); }
  .wbtn.active, .sbtn.active { background: var(--chrome-hi); }
  .wbtn .bar { background: var(--on-chrome); border-radius: 99px; }
  .sbtn svg { width: 22px; height: 12px; }
  .fillbtn { height: 28px; padding: 0 10px; border: 1px solid var(--chrome-line); background: transparent;
    color: var(--muted); border-radius: 8px; font: 600 11px 'Inter'; cursor: pointer; flex: 0 0 auto; }
  .fillbtn.active { background: var(--on-chrome); color: var(--chrome); border-color: var(--on-chrome); }
  .opacity { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .opacity input { width: 66px; accent-color: var(--accent); }
  .opacity span { font: 600 10px 'Inter'; color: var(--muted); min-width: 26px; text-align: right; }

  .controls { position: fixed; top: 14px; right: 14px; z-index: 30; display: flex; align-items: center; gap: 8px; }
  .pill { background: #fff; border: 1px solid rgba(16,18,29,.10); border-radius: 11px; box-shadow: var(--shadow);
    display: flex; align-items: center; overflow: hidden; }
  body.dark .pill, body.dark .zoom, body.dark .presence, body.dark .pagebar { background: #1E2230; border-color: #333a52; color: #EDEFF5; }
  .pill button { border: 0; background: transparent; color: var(--ink); height: 38px; padding: 0 12px;
    font: 600 13px 'Inter'; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  body.dark .pill button, body.dark .zoom button, body.dark .pagebar button { color: #EDEFF5; }
  .pill button:hover { background: #F2F1EA; } body.dark .pill button:hover { background: #2A2F42; }
  .pill button + button { border-left: 1px solid rgba(16,18,29,.08); }
  .pill button svg, .pagebar button svg { width: 15px; height: 15px; }
  .share { background: var(--ink); color: #fff; border: 0; border-radius: 11px; height: 40px; padding: 0 16px;
    font: 600 13px 'Inter'; cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 7px; }
  body.dark .share { background: #EDEFF5; color: #14161B; }
  .share:hover { background: #000; } .share svg { width: 15px; height: 15px; }
  .lockbtn { background: #fff; border: 1px solid rgba(16,18,29,.10); border-radius: 11px; height: 40px; padding: 0 14px;
    font: 600 13px 'Inter'; color: var(--ink); cursor: pointer; box-shadow: var(--shadow); display: flex; align-items: center; gap: 7px; }
  .lockbtn svg { width: 15px; height: 15px; }
  .lockbtn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .lockbtn.disabled, .lockbtn:disabled { background: #F2F1EA; color: var(--muted); cursor: not-allowed; box-shadow: none; }
  body.dark .lockbtn { background: #1E2230; color: #EDEFF5; border-color: #333a52; }
  body.dark .lockbtn.disabled, body.dark .lockbtn:disabled { background: #2A2F42; color: var(--muted); }
  .lockbanner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 45; background: var(--ink); color: #fff;
    font: 600 12px 'Inter'; padding: 9px 16px; border-radius: 10px; box-shadow: var(--dock-shadow); }
  body.dark .lockbanner { background: #EDEFF5; color: #14161B; }

  .pagebar { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 30;
    background: #fff; border: 1px solid rgba(16,18,29,.10); border-radius: 11px; box-shadow: var(--shadow);
    display: flex; align-items: center; height: 40px; overflow: hidden; }
  .pagebar .ucount { display: flex; align-items: center; gap: 5px; padding: 0 11px; font: 600 12px 'Inter'; color: var(--muted); }
  .pagebar .ucount svg { width: 14px; height: 14px; }
  .pagebar button { border: 0; background: transparent; color: var(--ink); height: 40px; width: 36px; cursor: pointer;
    display: grid; place-items: center; border-left: 1px solid rgba(16,18,29,.08); }
  .pagebar button:hover { background: #F2F1EA; } body.dark .pagebar button:hover { background: #2A2F42; }
  .pagebar .plabel { padding: 0 12px; font: 600 12px 'Inter'; color: var(--ink); border-left: 1px solid rgba(16,18,29,.08);
    min-width: 58px; text-align: center; }
  body.dark .pagebar .plabel { color: #EDEFF5; }

  .presence { position: fixed; top: 62px; right: 14px; z-index: 29; display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid rgba(16,18,29,.10); border-radius: 11px; box-shadow: var(--shadow);
    height: 34px; padding: 0 10px 0 8px; }
  .status { display: flex; align-items: center; gap: 6px; font: 600 12px 'Inter'; color: var(--muted); }
  .status .led { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 0 3px rgba(242,168,59,.18); }
  .status.live .led { background: var(--live); box-shadow: 0 0 0 3px rgba(53,192,139,.18); }
  .avatars { display: flex; } .avatars .av { width: 24px; height: 24px; border-radius: 50%; margin-left: -6px;
    border: 2px solid #fff; display: grid; place-items: center; color: #fff; font: 700 10px 'Inter'; }
  body.dark .avatars .av { border-color: #1E2230; }
  .avatars .av:first-child { margin-left: 0; }
  .me-name { border: 1px solid rgba(16,18,29,.16); background: #F7F6F0; font: 600 12px 'Inter'; color: var(--ink); width: 104px; padding: 4px 9px; border-radius: 8px; outline: none; }
  .me-name::placeholder { color: var(--muted); font-weight: 500; }
  .me-name:focus { border-color: var(--accent); background: #fff; }
  body.dark .me-name { color: #EDEFF5; background: #2A2F42; border-color: #3A4056; } body.dark .me-name:focus { background: #1E2230; border-color: var(--accent); }

  .zoom { position: fixed; bottom: 18px; right: 14px; z-index: 30; background: #fff; border: 1px solid rgba(16,18,29,.10);
    border-radius: 11px; box-shadow: var(--shadow); display: flex; align-items: center; overflow: hidden; }
  .zoom button { border: 0; background: transparent; height: 38px; width: 36px; cursor: pointer; color: var(--ink);
    display: grid; place-items: center; font: 600 16px 'Inter'; }
  .zoom button svg { width: 15px; height: 15px; }
  .zoom button:hover { background: #F2F1EA; } body.dark .zoom button:hover { background: #2A2F42; }
  .zoom .lvl { min-width: 50px; text-align: center; font: 600 12px 'Inter'; color: var(--muted);
    border-left: 1px solid rgba(16,18,29,.08); border-right: 1px solid rgba(16,18,29,.08); height: 38px; display: grid; place-items: center; cursor: pointer; }

  .rc { position: absolute; transform: translate(-2px,-2px); will-change: transform; transition: transform .06s linear; }
  .rc svg { display: block; width: 20px; height: 20px; }
  .rc .tag { position: absolute; top: 17px; left: 12px; white-space: nowrap; font: 600 10px 'Inter'; color: #fff; padding: 2px 7px; border-radius: 6px; box-shadow: var(--shadow); }

  #textedit { position: absolute; z-index: 25; display: none; background: transparent; border: none; outline: none;
    resize: none; overflow: hidden; padding: 0; margin: 0; line-height: 1.2; white-space: pre; font-family: 'Inter', sans-serif; caret-color: var(--accent); }

  .toast { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--ink); color: #fff;
    font: 600 13px 'Inter'; padding: 10px 16px; border-radius: 10px; box-shadow: var(--dock-shadow); opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 50; }
  body.dark .toast { background: #EDEFF5; color: #14161B; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .menu { position: fixed; z-index: 40; background: #fff; border: 1px solid rgba(16,18,29,.10); border-radius: 12px;
    box-shadow: var(--dock-shadow); padding: 6px; min-width: 190px; display: none; }
  body.dark .menu { background: #1E2230; color: #EDEFF5; border-color: #333a52; }
  .menu button { width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 11px; border-radius: 8px;
    font: 500 13px 'Inter'; color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 9px; }
  body.dark .menu button { color: #EDEFF5; }
  .menu button:hover { background: #F2F1EA; } body.dark .menu button:hover { background: #2A2F42; }
  .menu button svg { width: 15px; height: 15px; color: var(--muted); }
  .menu hr { border: 0; border-top: 1px solid rgba(16,18,29,.08); margin: 5px 2px; }
  .menu .row { display: flex; gap: 4px; padding: 4px 6px; }
  .menu .row button { justify-content: center; border: 1px solid rgba(16,18,29,.10); }
  .menu .row button.on { background: var(--accent); color: #fff; border-color: var(--accent); }

  @media (max-width: 720px) {
    .brand small { display: none; }
    .pill button span { display: none; }
    .lockbtn .lbl { display: none; }
    .presence .avatars { display: none; }
  }
  .qrmodal { position:fixed; inset:0; z-index:60; background:rgba(16,18,29,.55); display:flex; align-items:center; justify-content:center; padding:20px; }
  .qrmodal[hidden] { display:none; }
  .qrcard { background:#fff; border-radius:20px; box-shadow:var(--dock-shadow); padding:22px; max-width:360px; width:100%; text-align:center; position:relative; }
  body.dark .qrcard { background:#1E2230; color:#EDEFF5; }
  .qrcard h3 { font:700 17px 'Space Grotesk',sans-serif; margin:0 0 4px; }
  .qrcard p { font:500 12px 'Inter'; color:var(--muted); margin:0 0 16px; }
  .qrcard img { width:280px; height:280px; max-width:100%; image-rendering:pixelated; border:8px solid #fff; border-radius:12px; background:#fff; }
  .qrcard .qurl { font:500 11px 'Inter'; color:var(--muted); word-break:break-all; margin:14px 0 12px; }
  .qrcard .qrow { display:flex; gap:8px; justify-content:center; }
  .qrcard .qrow button { border:1px solid rgba(16,18,29,.16); background:transparent; border-radius:9px; padding:9px 14px; font:600 12px 'Inter'; color:var(--ink); cursor:pointer; }
  body.dark .qrcard .qrow button { color:#EDEFF5; border-color:#3A4056; }
  .qrcard .qclose { position:absolute; top:8px; right:12px; border:0; background:transparent; font-size:24px; line-height:1; color:var(--muted); cursor:pointer; }
</style>

<body>
  <div id="stage">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="cursors"></div>
    <textarea id="textedit" spellcheck="false"></textarea>
  </div>

  <noscript>
    <div style="position:fixed;inset:0;z-index:1000;background:#FBFAF6;color:#16181D;overflow:auto;padding:48px 22px;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;">
      <div style="max-width:760px;margin:0 auto;">
        <h2 style="font-size:30px;margin:0 0 10px;">ExplainerBoard — a free collaborative whiteboard</h2>
        <p style="font-size:17px;line-height:1.6;color:#3c404a;margin:0 0 8px;">ExplainerBoard is a free online whiteboard for sketching ideas and explaining them together in real time. Draw with a pen, add lines, rectangles, ellipses, arrows and text, work across multiple pages, switch to dark mode, and export your board as SVG, PNG or PDF — all in your browser, with no sign-up required.</p>
        <h3 style="font-size:20px;margin:22px 0 6px;">What you can do</h3>
        <ul style="font-size:16px;line-height:1.7;color:#3c404a;">
          <li>Freehand pen, lines, rectangles, ellipses, arrows and text</li>
          <li>Dashed and dotted strokes, adjustable width and opacity, fill</li>
          <li>Multiple pages with duplication, grids and snap-to-grid</li>
          <li>Real-time collaboration with live cursors and a presenter lock</li>
          <li>Export to SVG, PNG and PDF; save and open board files</li>
        </ul>
        <p style="font-size:16px;line-height:1.6;color:#3c404a;"><strong>ExplainerBoard needs JavaScript to run.</strong> Please enable JavaScript in your browser to start drawing.</p>
      </div>
    </div>
  </noscript>

  <h1 class="brand"><span class="dot"></span>ExplainerBoard <small>sketch &amp; explain, together</small></h1>
  <div class="credit">© <a href="https://www.gcjana.in" target="_blank" rel="noopener">Dr. Gopal Chandra Jana</a></div>

  <div class="dock" id="dock">
    <button class="tool active" data-tool="select" title="Select / Move (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l6 16 2-6 6-2z"/></svg><span class="kbd">V</span></button>
    <button class="tool" data-tool="pan" title="Pan (H / hold Space)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 11V6a1.5 1.5 0 00-3 0M15 6V4.5a1.5 1.5 0 00-3 0V6M12 6V5a1.5 1.5 0 00-3 0v7M9 9.5V8a1.5 1.5 0 00-3 0v6c0 3.5 2 6 5.5 6s5.5-2.5 5.5-6v-3"/></svg><span class="kbd">H</span></button>
    <hr/>
    <button class="tool" data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20c2-1 3.5-2.5 5-5 1.2-2 3-6 6-9 1.6-1.6 3.4 .2 1.8 1.8-3 3-7 4.8-9 6-2.5 1.5-4 3-4.8 6z"/></svg><span class="kbd">P</span></button>
    <button class="tool" data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19L19 5"/></svg><span class="kbd">L</span></button>
    <button class="tool" data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span class="kbd">R</span></button>
    <button class="tool" data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg><span class="kbd">O</span></button>

    <button data-act="load"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h6l2 2h8v12a2 2 0 01-2 2H4z"/><path d="M12 11v6M9 14l3-3 3 3"/></svg>Open board file</button>
    <button data-act="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15l5-4 4 3 3-2 6 4"/><circle cx="8.5" cy="9" r="1.3"/></svg>Import PDF / image to present…</button>
    <hr/>
    <button data-act="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Clear this page</button>

      <h3>Scan to join this board</h3>

  <div class="toast" id="toast"></div>
  <input type="file" id="fileInput" accept="application/json,.json" style="display:none" />
  <input type="file" id="importInput" accept="application/pdf,image/*" style="display:none" />

<script type="module">
window.global = window.global || window;
if (!window.process) window.process = { env: {}, nextTick: (f)=>setTimeout(f,0) };

/* ---- visible error reporter (helps diagnose issues on the live site) ---- */
function showFatal(msg){
  let el=document.getElementById("fatalBanner");
  if(!el){ el=document.createElement("div"); el.id="fatalBanner";
    el.style.cssText="position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#B3271E;color:#fff;font:600 12px/1.45 Inter,system-ui,sans-serif;padding:12px 40px 12px 14px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.32);white-space:pre-wrap;word-break:break-word";
    const x=document.createElement("button"); x.textContent="×"; x.style.cssText="position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1"; x.onclick=()=>el.remove(); el.appendChild(x);
    (document.body||document.documentElement).appendChild(el); }
  const t=document.createElement("div"); t.textContent="⚠ Something errored (please screenshot this): "+msg; el.appendChild(t);
}
window.addEventListener("error",(e)=>{
  const f=String(e.filename||""), msg=String(e.message||"");
  // ignore cross-origin / third-party noise (e.g. the flaky p2p sync libraries)
  if (f.includes("esm.sh") || f.includes("jsdelivr") || msg==="Script error." || msg==="Script error"){ console.warn("(ignored external error)", msg, f); return; }
  showFatal(msg+"  ["+f.split("/").pop()+":"+e.lineno+"]");
});
window.addEventListener("unhandledrejection",(e)=>{ const r=e.reason; console.warn("(sync/promise issue, non-fatal — board keeps working)", (r&&r.message)||r); });

const COLORS = ["#16181D","#6B7280","#B7BDC8","#FFFFFF","#2F6BFF","#12B5A5","#2FBF6B","#7A5AF8","#E8497B","#FF3B30","#FF5C49","#F5A623","#F5D90A"];
const WIDTHS = [2, 4, 8, 16];
const SVGNS = "http://www.w3.org/2000/svg";
const GRID = 32;
const DEFS = `<defs>
  <marker id="ebArrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10 3 5z" fill="context-stroke"/></marker>
</defs>`;

const state = {
  tool: "select", color: "#16181D", width: 4, fill: false,
  dash: "solid", arrow: "none", opacity: 1,
  grid: "square", snap: false, dark: false,
  view: { x: 0, y: 0, w: 1200, h: 800 },
  sel: new Set(), pageIdx: 0,
};

const board = document.getElementById("board");
const stage = document.getElementById("stage");
const cursorsLayer = document.getElementById("cursors");
const textedit = document.getElementById("textedit");
const elFor = new Map();
board.innerHTML = DEFS;

/* ---------------- shared store ---------------- */
let Y=null, ydoc=null, ymap=null, ypages=null, undoMgr=null, provider=null, awareness=null;
let localModel = new Map(), localPages = [];
let localHistory = [], localFuture = [];
const observers = [];
const room = getRoom();
const me = { name: loadName(), color: pickUserColor() };

async function initStore() {
  try {
    const yjs = await import("https://esm.sh/yjs@13.6.20");
    const { WebrtcProvider } = await import("https://esm.sh/y-webrtc@10.3.0?bundle");
    let idb=null; try { idb = await import("https://esm.sh/y-indexeddb@9.0.12"); } catch(e){}
    Y = yjs; ydoc = new Y.Doc();
    ymap = ydoc.getMap("shapes"); ypages = ydoc.getArray("pages");
    if (idb) { try { new idb.IndexeddbPersistence("eb-"+room, ydoc); } catch(e){} }
    undoMgr = new Y.UndoManager([ymap, ypages]);
    // preserve anything drawn before collaboration finished loading
    if (localModel.size || localPages.length){
      ydoc.transact(()=>{ if (localPages.length && ypages.length===0) ypages.insert(0, localPages.slice()); for (const [id,s] of localModel) ymap.set(id, s); });
      localModel.clear(); localPages.length=0;
    }
    provider = new WebrtcProvider("explainerboard-"+room, ydoc, { signaling: ["wss://signaling.yjs.dev","wss://y-webrtc-eu.fly.dev"] });
    awareness = provider.awareness;
    awareness.setLocalStateField("user", me);
    awareness.setLocalStateField("presenting", false);
    awareness.on("change", renderPresence);
    provider.on("status", (ev)=>{ setLive(!!(ev && ev.connected)); });
    provider.on("peers", (ev)=>{ const n=(ev.webrtcPeers?ev.webrtcPeers.length:0)+(ev.bcPeers?ev.bcPeers.length:0); if(n>0) setLive(true); });
    ymap.observeDeep(()=>notify()); ypages.observe(()=>{ clampPage(); renderPages(); notify(); });
  } catch (err) { console.warn("Collaboration unavailable — running solo.", err); setLive(false); }
  renderPages(); render(); renderPresence();
}
function usingY(){ return !!ymap; }

/* pages */
function pageList(){ const a = usingY()? ypages.toArray() : localPages; return a.length ? a.slice() : ["main"]; }
function materializePages(){
  if (usingY()){ if (ypages.length===0) ypages.insert(0,["main"]); }
  else { if (localPages.length===0) localPages = ["main"]; }
}
function currentPage(){ const l=pageList(); return l[clamp(state.pageIdx,0,l.length-1)]; }
function clampPage(){ const l=pageList(); state.pageIdx = clamp(state.pageIdx,0,l.length-1); }

/* store ops */
function shapesEntries(){ return usingY()? [...ymap.entries()] : [...localModel.entries()]; }
function getShape(id){ return usingY()? ymap.get(id) : localModel.get(id); }
function putShape(id, shape){
  if (lockedOut()) return;
  if (usingY()){ ymap.set(id, shape); }
  else { localHistory.push({t:"put", id, prev: localModel.get(id)||null, next: shape}); localFuture.length=0; localModel.set(id, shape); notify(); }
}
function delShape(id){
  if (lockedOut()) return;
  if (usingY()){ ymap.delete(id); }
  else { if(!localModel.has(id)) return; localHistory.push({t:"del", id, prev: localModel.get(id)}); localFuture.length=0; localModel.delete(id); notify(); }
}
function clearPage(){
  if (lockedOut()) return;
  const pg = currentPage();
  const ids = shapesEntries().filter(([,s])=>s.page===pg).map(([id])=>id);
  if (usingY()){ ydoc.transact(()=>ids.forEach(id=>ymap.delete(id))); }
  else { localHistory.push({t:"bulk", prev: ids.map(id=>[id, localModel.get(id)])}); localFuture.length=0; ids.forEach(id=>localModel.delete(id)); notify(); }
}
function txn(fn){ if(usingY()) ydoc.transact(fn); else fn(); }
function doUndo(){
  if (lockedOut()) return;
  if (usingY()){ undoMgr && undoMgr.undo(); }
  else { const op=localHistory.pop(); if(!op) return; localFuture.push(op);
    if(op.t==="put"){ if(op.prev) localModel.set(op.id,op.prev); else localModel.delete(op.id); }
    else if(op.t==="del"){ localModel.set(op.id,op.prev); }
    else if(op.t==="bulk"){ op.prev.forEach(([id,s])=>localModel.set(id,s)); }
    else if(op.t==="pages"){ localPages = op.prev.slice(); }
    notify(); renderPages(); }
}
function doRedo(){
  if (lockedOut()) return;
  if (usingY()){ undoMgr && undoMgr.redo(); }
  else { const op=localFuture.pop(); if(!op) return; localHistory.push(op);
    if(op.t==="put"){ localModel.set(op.id,op.next); }
    else if(op.t==="del"){ localModel.delete(op.id); }
    else if(op.t==="bulk"){ op.prev.forEach(([id])=>localModel.delete(id)); }
    else if(op.t==="pages"){ localPages = op.next.slice(); }
    notify(); renderPages(); }
}
function notify(){ observers.forEach(fn=>fn()); }
observers.push(()=>render());

/* ---------------- rendering ---------------- */
function applyView(){ board.setAttribute("viewBox", `${state.view.x} ${state.view.y} ${state.view.w} ${state.view.h}`); updateGrid(); updateZoomLabel(); }

function render(){
  const pg = currentPage();
  const present = new Set();
  for (const [id, s] of shapesEntries()){
    if (s.page !== pg) continue;
    present.add(id);
    let el = elFor.get(id);
    if (!el){ el = makeEl(s); if(!el) continue; el.classList.add("shape"); el.dataset.id=id; board.appendChild(el); elFor.set(id, el); }
    updateEl(el, s);
  }
  for (const [id, el] of [...elFor.entries()]){ if(!present.has(id)){ el.remove(); elFor.delete(id); } }
  for (const id of [...state.sel]) if(!present.has(id)) state.sel.delete(id);
  const defs=board.querySelector("defs");
  board.querySelectorAll('.shape[data-bg="1"]').forEach(el=>{ board.insertBefore(el, defs?defs.nextSibling:board.firstChild); });
  drawSelection();
}
function makeEl(s){
  if (s.type==="pen"||s.type==="line") return document.createElementNS(SVGNS,"path");
  if (s.type==="rect") return document.createElementNS(SVGNS,"rect");
  if (s.type==="ellipse") return document.createElementNS(SVGNS,"ellipse");
  if (s.type==="text") return document.createElementNS(SVGNS,"text");
  if (s.type==="image") return document.createElementNS(SVGNS,"image");
  return null;
}
function updateEl(el, s){
  const stroke = s.stroke || "#16181D";
  el.setAttribute("opacity", s.opacity==null?1:s.opacity);
  if (s.type==="image"){
    el.setAttribute("x", s.x); el.setAttribute("y", s.y);
    el.setAttribute("width", s.w); el.setAttribute("height", s.h);
    el.setAttribute("preserveAspectRatio","xMidYMid meet");
    try{ el.setAttribute("href", s.href); el.setAttributeNS("http://www.w3.org/1999/xlink","href", s.href); }catch(e){}
    if (s.bg){ el.setAttribute("pointer-events","none"); el.setAttribute("data-bg","1"); }
    return;
  }
  if (s.type==="text"){
    el.setAttribute("x", s.x); el.setAttribute("y", s.y); el.setAttribute("fill", stroke);
    el.setAttribute("font-family","Inter, sans-serif"); el.setAttribute("font-size", s.size||28); el.setAttribute("font-weight","500");
    el.textContent="";
    String(s.text||"").split("\n").forEach((ln,i)=>{ const t=document.createElementNS(SVGNS,"tspan"); t.setAttribute("x",s.x); t.setAttribute("dy", i===0?0:(s.size||28)*1.2); t.textContent=ln.length?ln:" "; el.appendChild(t); });
    return;
  }
  el.setAttribute("stroke", stroke); el.setAttribute("stroke-width", s.width||4);
  el.setAttribute("fill", s.fill ? stroke : "none"); el.setAttribute("fill-opacity", s.fill ? 0.14 : 0);
  const w = s.width||4;
  if (s.dash==="dashed") el.setAttribute("stroke-dasharray", `${w*3} ${w*2}`);
  else if (s.dash==="dotted") el.setAttribute("stroke-dasharray", `0.01 ${w*2}`);
  else el.removeAttribute("stroke-dasharray");
  el.removeAttribute("marker-start"); el.removeAttribute("marker-end");
  if (s.arrow==="end" || s.arrow==="both") el.setAttribute("marker-end","url(#ebArrow)");
  if (s.arrow==="both") el.setAttribute("marker-start","url(#ebArrow)");
  if (s.type==="pen") el.setAttribute("d", penPath(s.points));
  else if (s.type==="line") el.setAttribute("d", `M${s.x1} ${s.y1}L${s.x2} ${s.y2}`);
  else if (s.type==="rect"){ const x=Math.min(s.x1,s.x2), y=Math.min(s.y1,s.y2);
    el.setAttribute("x",x); el.setAttribute("y",y); el.setAttribute("width",Math.abs(s.x2-s.x1)); el.setAttribute("height",Math.abs(s.y2-s.y1)); el.setAttribute("rx", Math.min(6, Math.abs(s.x2-s.x1)/8)); }
  else if (s.type==="ellipse"){ el.setAttribute("cx",(s.x1+s.x2)/2); el.setAttribute("cy",(s.y1+s.y2)/2); el.setAttribute("rx",Math.abs(s.x2-s.x1)/2); el.setAttribute("ry",Math.abs(s.y2-s.y1)/2); }
}
function penPath(pts){
  if(!pts||!pts.length) return "";
  if(pts.length===1){ const [x,y]=pts[0]; return `M${x} ${y}l0.01 0.01`; }
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1]; const mx=(x0+pts[i][0])/2, my=(y0+pts[i][1])/2; d+=`Q${x0} ${y0} ${mx} ${my}`; }
  const last=pts[pts.length-1]; d+=`L${last[0]} ${last[1]}`; return d;
}

let selLayer=null;
function drawSelection(){
  if (selLayer){ selLayer.remove(); selLayer=null; }
  if (!state.sel.size) return;
  selLayer=document.createElementNS(SVGNS,"g"); selLayer.setAttribute("pointer-events","none");
  const sw = 1.5*state.view.w/board.clientWidth;
  for (const id of state.sel){ const el=elFor.get(id); if(!el) continue; let bb; try{bb=el.getBBox();}catch(e){continue;}
    const r=document.createElementNS(SVGNS,"rect"); r.setAttribute("x",bb.x-6); r.setAttribute("y",bb.y-6);
    r.setAttribute("width",bb.width+12); r.setAttribute("height",bb.height+12); r.setAttribute("fill","none");
    r.setAttribute("stroke","#FF5C49"); r.setAttribute("stroke-width",sw);
    r.setAttribute("stroke-dasharray",`${6*sw} ${4*sw}`); selLayer.appendChild(r); }
  board.appendChild(selLayer);
}

/* ---------------- coords ---------------- */
function toBoard(cx, cy){ const pt=board.createSVGPoint(); pt.x=cx; pt.y=cy; const m=board.getScreenCTM(); if(!m) return {x:cx,y:cy}; const p=pt.matrixTransform(m.inverse()); return {x:p.x,y:p.y}; }
function toScreen(bx, by){ const pt=board.createSVGPoint(); pt.x=bx; pt.y=by; const m=board.getScreenCTM(); if(!m) return {x:bx,y:by}; const p=pt.matrixTransform(m); return {x:p.x,y:p.y}; }

/* ---------------- interaction ---------------- */
let action=null;
function uid(){ return Math.random().toString(36).slice(2,10); }
const r=(n)=>Math.round(n*100)/100;
const sp=(n)=> state.snap ? Math.round(n/GRID)*GRID : r(n);

stage.addEventListener("pointerdown", onDown);
window.addEventListener("pointermove", onMove);
window.addEventListener("pointerup", onUp);
let spaceDown=false;
window.addEventListener("keydown",(e)=>{ if(e.code==="Space" && !isTyping()){ spaceDown=true; stage.style.cursor="grab"; } });
window.addEventListener("keyup",(e)=>{ if(e.code==="Space"){ spaceDown=false; stage.style.cursor=""; } });

function onDown(e){
  if (e.target.closest(".dock,.tray,.controls,.zoom,.presence,.menu,.brand,.pagebar")) return;
  hideMenu();
  const b = toBoard(e.clientX, e.clientY);
  if (lockedOut()){
    const pan = spaceDown || e.button===1 || state.tool==="pan";
    if (pan){ action={kind:"pan", sx:e.clientX, sy:e.clientY, ox:state.view.x, oy:state.view.y}; stage.style.cursor="grabbing"; }
    return;
  }
  const panMode = spaceDown || e.button===1 || state.tool==="pan";

function zoomAt(cx,cy,f){ const before=toBoard(cx,cy); const nw=clamp(state.view.w*f,60,60000); state.view.h*=nw/state.view.w; state.view.w=nw; applyView(); const after=toBoard(cx,cy); state.view.x+=before.x-after.x; state.view.y+=before.y-after.y; applyView(); drawSelection(); }

function boundsOfPage(){ const pg=currentPage(); let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,any=false;

    any=true; minx=Math.min(minx,bb.x); miny=Math.min(miny,bb.y); maxx=Math.max(maxx,bb.x+bb.width); maxy=Math.max(maxy,bb.y+bb.height); }

function duplicateSel(){ if(!state.sel.size) return; const pg=currentPage(); const ids=[]; txn(()=>{ for(const id of state.sel){ const s=JSON.parse(JSON.stringify(getShape(id))); s.page=pg; offset(s,16,16); const nid=uid(); putShape(nid,s); ids.push(nid); } }); state.sel=new Set(ids); drawSelection(); }
function selectAll(){ const pg=currentPage(); state.sel=new Set(shapesEntries().filter(([,s])=>s.page===pg).map(([id])=>id)); drawSelection(); }
function offset(s,dx,dy){ if(s.type==="pen") s.points=s.points.map(([x,y])=>[r(x+dx),r(y+dy)]); else if(s.type==="text"){ s.x=r(s.x+dx); s.y=r(s.y+dy); } else { s.x1=r(s.x1+dx); s.y1=r(s.y1+dy); s.x2=r(s.x2+dx); s.y2=r(s.y2+dy); } }

/* ---------------- export/save/load ---------------- */
function buildSVG(){ const b=boundsOfPage(); const pad=24; const x=(b?b.x:0)-pad, y=(b?b.y:0)-pad, w=(b?b.w:400)+pad*2, h=(b?b.h:300)+pad*2;
  let inner=""; const pg=currentPage();
  for(const [id,s] of shapesEntries()){ if(s.page!==pg) continue; const el=elFor.get(id); if(!el) continue; const n=el.cloneNode(true); n.removeAttribute("class"); n.removeAttribute("data-id"); inner+=n.outerHTML; }
  const bg=state.dark?"#14161B":"#FBFAF6";
  return `<svg xmlns="${SVGNS}" viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}">${DEFS}<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${bg}"/>${inner}</svg>`; }
function download(name, blob){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); }
function exportSVG(){ download("explainerboard.svg", new Blob([buildSVG()],{type:"image/svg+xml"})); toast("SVG downloaded"); }
function exportPNG(){ const svg=buildSVG(); const img=new Image(); img.onload=()=>{ const scale=2, c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale; const ctx=c.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0); c.toBlob(bl=>{ download("explainerboard.png",bl); toast("PNG downloaded"); }); }; img.onerror=()=>toast("Couldn't render PNG"); img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg))); }
async function exportPDF(){
  toast("Preparing PDF…");
  let mod; try{ mod = await import("https://esm.sh/jspdf@2.5.1"); }
  catch(e){ console.warn(e); toast("PDF export needs a network connection"); return; }
  const JsPDF = mod.jsPDF || (mod.default && mod.default.jsPDF) || mod.default;
  const svg=buildSVG(); const img=new Image();
  img.onload=()=>{ try{
      const scale=2, c=document.createElement("canvas"); c.width=img.width*scale; c.height=img.height*scale;
      const ctx=c.getContext("2d"); ctx.scale(scale,scale); ctx.drawImage(img,0,0);
      const png=c.toDataURL("image/png"); const w=img.width||800, h=img.height||600;
      const pdf=new JsPDF({ orientation: w>=h?"landscape":"portrait", unit:"pt", format:[w,h], compress:true });
      pdf.addImage(png,"PNG",0,0,w,h); pdf.save("explainerboard.pdf"); toast("PDF downloaded");
    }catch(err){ console.warn(err); toast("Couldn't build the PDF"); } };
  img.onerror=()=>toast("Couldn't render PDF");
  img.src="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svg)));
}
function saveFile(){ const data={ app:"explainerboard", version:2, pages:pageList(), shapes:shapesEntries().map(([id,s])=>({id,...s})) }; download("explainerboard.json", new Blob([JSON.stringify(data)],{type:"application/json"})); toast("Board saved"); }
document.getElementById("fileInput").addEventListener("change",(e)=>{ if(lockedOut()){ toast(presenterName()+" is editing"); e.target.value=""; return; } const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const data=JSON.parse(rd.result); if(!data.shapes) throw 0;
    txn(()=>{ // clear everything
      const allIds=shapesEntries().map(([id])=>id); allIds.forEach(id=>delShape(id));
      if(usingY()){ if(ypages.length) ypages.delete(0,ypages.length); if(data.pages&&data.pages.length) ypages.insert(0,data.pages); }
      else { localPages = (data.pages&&data.pages.length)?data.pages.slice():[]; }
      data.shapes.forEach(sh=>{ const {id,...rest}=sh; if(!rest.page) rest.page = (data.pages&&data.pages[0])||"main"; putShape(id||uid(), rest); }); });
    state.pageIdx=0; renderPages(); render(); setTimeout(fitView,60); toast("Board loaded");
  }catch(err){ toast("That file isn't an ExplainerBoard board"); } };
  rd.readAsText(f); e.target.value=""; });

/* ---------------- menu ---------------- */
const menu=document.getElementById("menu");
document.getElementById("menuBtn").onclick=(e)=>{ const rr=e.currentTarget.getBoundingClientRect(); menu.style.display="block"; menu.style.top=(rr.bottom+8)+"px"; menu.style.right=(innerWidth-rr.right)+"px"; };
function hideMenu(){ menu.style.display="none"; }
window.addEventListener("pointerdown",(e)=>{ if(!e.target.closest("#menu,#menuBtn")) hideMenu(); }, true);
menu.addEventListener("click",(e)=>{ const b=e.target.closest("button[data-act]"); if(!b) return; const act=b.dataset.act; hideMenu();
  if(act==="svg") exportSVG(); else if(act==="png") exportPNG(); else if(act==="pdf") exportPDF(); else if(act==="save") saveFile();
  else if(act==="load") document.getElementById("fileInput").click();
  else if(act==="import") document.getElementById("importInput").click();
  else if(act==="clear"){ if(confirm("Clear this page for everyone in the room?")){ clearPage(); state.sel.clear(); } }
  else if(act==="clearall"){ if(confirm("Remove ALL pages and everything on them (including imported slides)? This cannot be undone.")){ clearAllPages(); } } });
function clearAllPages(){
  if(lockedOut()){ toast(presenterName()+" is editing"); return; }
  const ids=shapesEntries().map(([id])=>id);
  if(usingY()){ ydoc.transact(()=>{ ids.forEach(id=>ymap.delete(id)); if(ypages.length) ypages.delete(0,ypages.length); }); }
  else { ids.forEach(id=>localModel.delete(id)); localPages=[]; }
  state.pageIdx=0; state.sel.clear();
  state.view={x:-board.clientWidth/2, y:-board.clientHeight/2, w:board.clientWidth, h:board.clientHeight};
  applyView(); renderPages(); render(); toast("All pages cleared");
}
document.getElementById("undoBtn").onclick=doUndo; document.getElementById("redoBtn").onclick=doRedo;

/* ---------------- import & present (PDF / image) ---------------- */
function ebFileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function ebImgSize(src){ return new Promise((res)=>{ const im=new Image(); im.onload=()=>res({w:im.naturalWidth||1000,h:im.naturalHeight||700}); im.onerror=()=>res({w:1000,h:700}); im.src=src; }); }
function ebFrameRect(x,y,w,h){ const pad=40, ar=board.clientWidth/board.clientHeight; let vw=w+pad*2, vh=h+pad*2; if(vw/vh>ar) vh=vw/ar; else vw=vh*ar; state.view={x:x+w/2-vw/2, y:y+h/2-vh/2, w:vw, h:vh}; applyView(); drawSelection(); }
async function ebImportFile(file){
  if(!file) return;
  if(lockedOut()){ toast(presenterName()+" is editing"); return; }
  const name=(file.name||"").toLowerCase();
  if(/\.(pptx?|key|docx?|pages|odp|odt|rtf)$/.test(name)){ toast("For PowerPoint / Word / Pages, export to PDF first, then import the PDF."); return; }
  try{
    if(file.type==="application/pdf" || /\.pdf$/.test(name)) await ebImportPDF(file);
    else if((file.type||"").indexOf("image/")===0 || /\.(png|jpe?g|gif|webp|svg)$/.test(name)) await ebImportImage(file);
    else toast("Unsupported file — use a PDF or image (export slides/docs to PDF first).");
  }catch(e){ console.warn("import:",e); toast("Import failed: "+((e&&e.message)||e)); }
}
async function ebImportImage(file){
  toast("Importing image…");
  const href=await ebFileToDataURL(file);
  const dim=await ebImgSize(href);
  const W=1000, H=Math.max(120, Math.round(W*(dim.h/(dim.w||1))) || 700);
  putShape("img"+uid(), {type:"image", page:currentPage(), x:0, y:0, w:W, h:H, href:href, bg:true, opacity:1});
  render(); ebFrameRect(0,0,W,H); toast("Image added — draw on top to annotate");
}
async function ebImportPDF(file){
  toast("Loading PDF…");
  const pdfjs=await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.min.mjs");
  try{ pdfjs.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@4/build/pdf.worker.min.mjs"; }catch(e){}
  const data=await file.arrayBuffer();
  const pdf=await pdfjs.getDocument({data:data}).promise;
  const n=Math.min(pdf.numPages, 60);
  materializePages();
  let firstPid=null, firstH=700;
  for(let i=1;i<=n;i++){
    toast("Rendering slide "+i+" of "+n+"…");
    const page=await pdf.getPage(i);
    const base=page.getViewport({scale:1});
    const scale=1500/(base.width||1000);
    const vp=page.getViewport({scale:scale});
    const canvas=document.createElement("canvas"); canvas.width=Math.round(vp.width); canvas.height=Math.round(vp.height);
    await page.render({canvasContext:canvas.getContext("2d"), viewport:vp}).promise;
    const href=canvas.toDataURL("image/jpeg", 0.82);
    const W=1000, H=Math.round(W*(vp.height/(vp.width||1)));
    const pid="pg"+uid();
    if(usingY()) ypages.push([pid]); else localPages.push(pid);
    if(!firstPid){ firstPid=pid; firstH=H; }
    putShape("img"+uid(), {type:"image", page:pid, x:0, y:0, w:W, h:H, href:href, bg:true, opacity:1});
  }
  const l=pageList(); const idx=l.indexOf(firstPid); if(idx>=0) state.pageIdx=idx;
  state.sel.clear(); renderPages(); render(); ebFrameRect(0,0,1000,firstH);
  toast(n+" slide"+(n>1?"s":"")+" imported — flip with the page arrows, draw to annotate");
}
document.getElementById("importInput").addEventListener("change",(e)=>{ const f=e.target.files[0]; e.target.value=""; ebImportFile(f); });

/* ---------------- share/name ---------------- */
document.getElementById("shareBtn").onclick=async()=>{ const url=location.href; try{ await navigator.clipboard.writeText(url); toast("Link copied — scan or share the QR to join"); }catch(e){ prompt("Copy this room link:", url); } if(ebQROK) ebOpenQR(); };
const meNameEl=document.getElementById("meName"); meNameEl.value=me.name;
meNameEl.addEventListener("input",()=>{ me.name=meNameEl.value||"Guest"; saveName(me.name); if(awareness) awareness.setLocalStateField("user",me); renderPresence(); });

/* ---------------- helpers ---------------- */
function getRoom(){ const m=location.hash.match(/room=([A-Za-z0-9_-]+)/); if(m) return m[1]; const id=uid()+uid(); history.replaceState(null,"","#room="+id); return id; }
function pickUserColor(){ const c=["#FF5C49","#2F6BFF","#12B5A5","#7A5AF8","#F5A623","#2FBF6B","#E8497B"]; return c[Math.floor(Math.random()*c.length)]; }
function loadName(){ try{ return localStorage.getItem("eb-name")||randName(); }catch(e){ return randName(); } }
function saveName(n){ try{ localStorage.setItem("eb-name",n); }catch(e){} }
function randName(){ const a=["Quick","Clever","Bright","Calm","Bold","Neat","Sunny","Swift"], b=["Otter","Finch","Maple","Comet","Willow","Cedar","Robin","Fox"]; return a[Math.floor(Math.random()*a.length)]+" "+b[Math.floor(Math.random()*b.length)]; }
let toastT=null; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
window.addEventListener("resize",()=>{ applyView(); drawSelection(); renderPresence(); });
function loop(){ if(rcEls.size) renderPresence(); requestAnimationFrame(loop); } requestAnimationFrame(loop);

/* ---------------- boot ---------------- */
/* ---------------- QR code to join ---------------- */
let ebQRlib=null, ebQROK=false;
async function ebEnsureQR(){ if(ebQRlib) return ebQRlib; const m=await import("https://esm.sh/qrcode-generator@1.4.4"); ebQRlib=m.default||m; return ebQRlib; }
function ebRoomURL(){ return location.href; }
async function ebQRDataURL(cell, margin){ const q=await ebEnsureQR(); const qr=q(0,'M'); qr.addData(ebRoomURL()); qr.make(); return qr.createDataURL(cell, margin); }
async function ebInitQR(){
  try{ await ebQRDataURL(3,4); ebQROK=true; }
  catch(e){ console.warn("QR unavailable:", e); return; }
  document.getElementById("qrClose").onclick=ebCloseQR;
  document.getElementById("qrModal").addEventListener("click",(e)=>{ if(e.target.id==="qrModal") ebCloseQR(); });
  document.getElementById("qrCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(ebRoomURL()); toast("Link copied"); }catch(e){ prompt("Copy this link:", ebRoomURL()); } };
  window.addEventListener("keydown",(e)=>{ if(e.key==="Escape") ebCloseQR(); });
}
async function ebOpenQR(){ try{ document.getElementById("qrBig").src=await ebQRDataURL(8,4); }catch(e){} document.getElementById("qrUrl").textContent=ebRoomURL(); document.getElementById("qrModal").hidden=false; }
function ebCloseQR(){ document.getElementById("qrModal").hidden=true; }

/* ---------------- boot ---------------- */
(function boot(){ state.view={x:-board.clientWidth/2,y:-board.clientHeight/2,w:board.clientWidth,h:board.clientHeight}; applyView(); setTool("select"); initStore(); ebInitQR(); })();
</script>
